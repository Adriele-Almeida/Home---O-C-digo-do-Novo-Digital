<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Código do Novo Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0e27;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            pointer-events: none;
        }

        .logo-container {
            animation: float 6s ease-in-out infinite;
        }

        .logo-container img {
            max-width: 600px;
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 40px rgba(0, 217, 255, 0.8))
                    drop-shadow(0 0 80px rgba(0, 217, 255, 0.4));
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @media (max-width: 768px) {
            .logo-container img {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="content">
        <div class="logo-container">
            <img src="logo-branco.png" alt="O Código do Novo Digital" id="logo">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 60; // Reduzido para menos poluição
        const connectionDistance = 120; // Conexões mais curtas
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const logoRadius = 350; // Área maior, mais espaçada

        class Particle {
            constructor(isOrbiting = false) {
                this.isOrbiting = isOrbiting;

                if (isOrbiting) {
                    // Partículas que orbitam a logo
                    const angle = Math.random() * Math.PI * 2;
                    const distance = logoRadius + (Math.random() - 0.5) * 100;
                    this.x = centerX + Math.cos(angle) * distance;
                    this.y = centerY + Math.sin(angle) * distance;
                    this.angle = angle;
                    this.orbitSpeed = (Math.random() - 0.5) * 0.002;
                    this.orbitRadius = distance;
                } else {
                    // Partículas regulares com tendência ao centro
                    const bias = Math.random() < 0.6 ? 1 : 0; // 60% perto do centro
                    if (bias) {
                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * logoRadius * 1.5;
                        this.x = centerX + Math.cos(angle) * distance;
                        this.y = centerY + Math.sin(angle) * distance;
                    } else {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                    }
                }

                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.radius = Math.random() * 2 + 1;

                // Partículas perto do centro são maiores e mais brilhantes
                const distFromCenter = Math.sqrt(
                    Math.pow(this.x - centerX, 2) +
                    Math.pow(this.y - centerY, 2)
                );
                if (distFromCenter < logoRadius) {
                    this.radius *= 1.3;
                    this.brightness = 0.9;
                } else {
                    this.brightness = 0.6;
                }
            }

            update() {
                if (this.isOrbiting) {
                    // Movimento orbital
                    this.angle += this.orbitSpeed;
                    this.x = centerX + Math.cos(this.angle) * this.orbitRadius;
                    this.y = centerY + Math.sin(this.angle) * this.orbitRadius;

                    // Variação sutil no raio
                    this.orbitRadius += Math.sin(this.angle * 3) * 0.1;
                } else {
                    // Movimento livre com leve atração ao centro
                    const dx = centerX - this.x;
                    const dy = centerY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > logoRadius * 2) {
                        // Atração suave ao centro
                        this.vx += (dx / dist) * 0.01;
                        this.vy += (dy / dist) * 0.01;
                    }

                    this.x += this.vx;
                    this.y += this.vy;

                    // Limites da tela
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                    // Limitar velocidade
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > 2) {
                        this.vx = (this.vx / speed) * 2;
                        this.vy = (this.vy / speed) * 2;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 217, 255, ${this.brightness})`;
                ctx.shadowBlur = 15 * this.brightness;
                ctx.shadowColor = '#00D9FF';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Criar partículas: 80% normais, 20% orbitando
        for (let i = 0; i < particleCount; i++) {
            const isOrbiting = i < particleCount * 0.2;
            particles.push(new Particle(isOrbiting));
        }

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        // Conexões mais fortes perto do centro
                        const midX = (particles[i].x + particles[j].x) / 2;
                        const midY = (particles[i].y + particles[j].y) / 2;
                        const distFromCenter = Math.sqrt(
                            Math.pow(midX - centerX, 2) +
                            Math.pow(midY - centerY, 2)
                        );

                        const centerBoost = distFromCenter < logoRadius ? 1.2 : 1;
                        const opacity = (1 - distance / connectionDistance) * 0.25 * centerBoost;

                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 217, 255, ${opacity})`;
                        ctx.lineWidth = distFromCenter < logoRadius ? 1.5 : 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            connectParticles();

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Recalcular centro
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
        });
    </script>
</body>
</html>
